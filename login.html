<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#005F6A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Coren-PE - Login</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/img/icons/icon-192x192.webp">
    <link rel="preload" href="/img/icons/icon-512x512.webp" as="image">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light" aria-label="Navegação principal">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <img src="/img/icons/icon-512x512.webp" alt="Logo COREN-PE" width="200" loading="lazy">
            </a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Alternar navegação">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="#">INSTITUCIONAL</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">SERVIÇOS</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">LEGISLAÇÃO</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">FISCALIZAÇÃO</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">PUBLICAÇÕES</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">CONTATO</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <section class="banner-servicos">
        <div class="container text-center text-white">
            <h1>Serviços</h1>
            <p>Acesso online</p>
        </div>
    </section>
    <section class="login-section py-5">
        <div class="container">
            <h2 class="text-center mb-4">Login</h2>
            <form id="loginForm" class="mx-auto" style="max-width: 500px;">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="Digite seu e-mail" required aria-describedby="emailHelp">
                    <small id="emailHelp" class="form-text text-muted">Insira seu e-mail registrado.</small>
                </div>
                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" class="form-control" id="senha" name="senha" placeholder="Digite sua senha" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block" aria-label="Entrar na plataforma COREN-PE">Entrar</button>
                <p class="text-center mt-3">Não tem uma conta? <a href="/cadastro.html" aria-label="Cadastrar-se na plataforma COREN-PE">Cadastre-se</a></p>
                <noscript>
                    <p class="text-center text-warning">Este formulário requer JavaScript para funcionar. Habilite o JavaScript ou use um navegador moderno.</p>
                </noscript>
                <div id="mensagem" class="mt-3" aria-live="polite"></div>
            </form>
        </div>
    </section>
    <footer class="bg-dark text-white text-center py-3">
        <p>© 2025 COREN-PE. Todos os direitos reservados.</p>
    </footer>
    <script defer src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script defer src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="/js/login.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/js/service-worker.js')
                    .then(reg => console.log('Service Worker registrado com sucesso:', reg.scope))
                    .catch(err => {
                        console.error('Erro ao registrar Service Worker:', err);
                        alert('Falha ao registrar o Service Worker. Verifique o console para detalhes.');
                    });
            });
        }
    </script>
</body>
</html>
