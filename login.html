<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h2 class="text-center mt-5">Login</h2>
                <form id="loginForm" aria-labelledby="login-title">
                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="Digite seu e-mail" required aria-describedby="email-error">
                        <small id="email-error" class="form-text text-danger d-none">Por favor, insira um e-mail válido.</small>
                    </div>
                    <div class="form-group">
                        <label for="senha">Senha</label>
                        <input type="password" class="form-control" id="senha" name="senha" placeholder="Digite sua senha" required aria-describedby="senha-error">
                        <small id="senha-error" class="form-text text-danger d-none">A senha é obrigatória.</small>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Entrar</button>
                    <p class="text-center mt-3">Não tem uma conta? <a href="/cadastro.html">Cadastre-se</a></p>
                    <div id="mensagem" class="mt-3"></div>
                </form>
            </div>
        </div>
    </div>
