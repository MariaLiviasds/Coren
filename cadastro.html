<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aplicação web do COREN-PE para login e cadastro de profissionais.">
    <meta name="keywords" content="COREN-PE, login, cadastro, enfermagem, Pernambuco">
    <meta name="author" content="Lívia">
    <title>Coren-PE - Cadastro</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/img/icons/icon-192x192.png" type="image/png">
</head>
<body>
    <div class="container-fluid d-flex flex-column justify-content-center align-items-center min-vh-100">
        <img src="/img/Coren.png" alt="Coren-PE" class="mb-3 logo">
        <h2 class="text-center mb-3" style="color: #003366;">Cadastro</h2>
        <form id="cadastroForm" class="w-75">
            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" class="form-control form-control-lg" id="nome" name="nome" placeholder="Digite seu nome" aria-label="Nome completo do usuário" required>
            </div>
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" class="form-control form-control-lg" id="email" name="email" placeholder="Digite seu e-mail" aria-label="E-mail do usuário" required>
            </div>
            <div class="form-group">
                <label for="cpf">CPF</label>
                <input type="text" class="form-control form-control-lg" id="cpf" name="cpf" placeholder="Digite seu CPF" aria-label="CPF do usuário" required>
            </div>
            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" class="form-control form-control-lg" id="senha" name="senha" placeholder="Digite sua senha" aria-label="Senha do usuário" required>
            </div>
            <div class="form-group">
                <label for="confirmarSenha">Confirmar Senha</label>
                <input type="password" class="form-control form-control-lg" id="confirmarSenha" name="confirmarSenha" placeholder="Confirme sua senha" aria-label="Confirmação de senha" required>
            </div>
            <button type="submit" class="btn btn-primary btn-lg btn-block">Cadastrar</button>
            <p class="text-center mt-2">Já tem uma conta? <a href="/login.html">Fazer Login</a></p>
            <div id="mensagem" class="mt-2"></div>
        </form>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="/cadastro.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js')
                .then(() => console.log('Service Worker registrado'))
                .catch(error => console.error('Erro ao registrar Service Worker:', error));
        }
    </script>
</body>
</html>
