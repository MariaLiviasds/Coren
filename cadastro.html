<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Página de cadastro do COREN-PE para novos profissionais de enfermagem.">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://*.netlify.app; style-src 'self' https://stackpath.bootstrapcdn.com; script-src 'self' https://code.jquery.com https://cdn.jsdelivr.net https://stackpath.bootstrapcdn.com https://cdn-cgi/*; connect-src 'self';">
    <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin">
    <title>Coren-PE - Cadastro</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="/css/cadastro.css">

    <link rel="icon" href="/img/Coren.webp" type="image/webp">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="/"> 
                <img src="/img/Coren.webp" alt="Coren-PE" width="200" height="60" loading="lazy">
            </a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="#">INSTITUCIONAL</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">SERVIÇOS</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">LEGISLAÇÃO</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">FISCALIZAÇÃO</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">PUBLICAÇÕES</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">CONTATO</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <section class="banner-servicos">
        <div class="container text-center text-white">
            <h1>Serviços</h1>
            <p>Acesso online</p>
        </div>
    </section>
    <section class="cadastro-section py-5">
        <div class="container">
            <h2 class="text-center mb-4">Cadastro</h2>
            <form id="cadastroForm" class="mx-auto" style="max-width: 500px;" aria-labelledby="cadastro-title">
                <div class="form-group">
                    <label for="nome">Nome Completo</label>
                    <input type="text" class="form-control" id="nome" name="nome" placeholder="Digite seu nome" required aria-describedby="nome-error">
                    <small id="nome-error" class="form-text text-danger d-none">O nome é obrigatório.</small>
                </div>
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="Digite seu e-mail" required aria-describedby="email-error">
                    <small id="email-error" class="form-text text-danger d-none">Por favor, insira um e-mail válido.</small>
                </div>
                <div class="form-group">
                    <label for="cpf">CPF</label>
                    <input type="text" class="form-control" id="cpf" name="cpf" placeholder="Digite seu CPF" required aria-describedby="cpf-error">
                    <small id="cpf-error" class="form-text text-danger d-none">CPF inválido.</small>
                </div>
                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" class="form-control" id="senha" name="senha" placeholder="Digite sua senha" required aria-describedby="senha-error">
                    <small id="senha-error" class="form-text text-danger d-none">A senha é obrigatória.</small>
                </div>
                <div class="form-group">
                    <label for="confirmarSenha">Confirmar Senha</label>
                    <input type="password" class="form-control" id="confirmarSenha" name="confirmarSenha" placeholder="Confirme sua senha" required aria-describedby="confirmarSenha-error">
                    <small id="confirmarSenha-error" class="form-text text-danger d-none">As senhas não coincidem.</small>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Cadastrar</button>
                <div id="mensagem" class="mt-3"></div>
            </form>
        </div>
    </section>
    <script defer src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script defer src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script defer src="/js/cadastro.js"></script>
