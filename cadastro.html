<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cadastre-se no COREN-PE para acessar serviços exclusivos.">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://*.netlify.app; style-src 'self' https://stackpath.bootstrapcdn.com 'unsafe-inline'; script-src 'self' https://code.jquery.com https://cdn.jsdelivr.net https://stackpath.bootstrapcdn.com 'unsafe-inline'; connect-src 'self';">
    <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin">
    <title>Cadastro - COREN-PE</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/cadastro.css">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/img/Coren.webp" type="image/webp">
</head>
<body>
    <header class="bg-primary text-white text-center py-3">
        <img src="/img/Coren.webp" alt="Logo COREN-PE" width="120" height="120" loading="lazy">
        <h1>Cadastro</h1>
    </header>
    <main class="container my-5">
        <form class="col-md-6 mx-auto">
            <div class="form-group">
                <label for="name">Nome</label>
                <input type="text" class="form-control" id="name" required>
            </div>
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary">Cadastrar</button>
        </form>
        <p class="text-center mt-3">
            Já tem conta? <a href="/login.html">Faça login</a>
        </p>
    </main>
    <footer class="bg-dark text-white text-center py-3">
        <p>© 2025 COREN-PE. Todos os direitos reservados.</p>
    </footer>
    <script defer src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script defer src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script defer src="/js/cadastro.js"></script>
    <script defer src="/js/service-worker.js"></script>
</body>
</html>
