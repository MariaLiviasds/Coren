<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aplicação web do COREN-PE para login e cadastro de profissionais.">
    <meta name="keywords" content="COREN-PE, login, cadastro, enfermagem, Pernambuco">
    <meta name="author" content="Lívia">
    <title>Coren-PE - Bem-vindo</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/login.css">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/img/icons/icon-192x192.png" type="image/png">
</head>
<body>
    <div class="container-fluid d-flex flex-column justify-content-center align-items-center min-vh-100 login-section">
        <img src="/img/Coren.png" alt="Coren-PE" class="mb-2 logo" width="120" height="120">
        <h1 class="text-center mb-2" style="color: #003366; font-size: 1.5rem;">Bem-vindo ao COREN-PE</h1>
        <a href="/login.html" class="btn btn-primary btn-lg mb-1 w-75" aria-label="Ir para a página de login">Fazer Login</a>
        <a href="/cadastro.html" class="btn btn-outline-primary btn-lg w-75" aria-label="Ir para a página de cadastro">Cadastrar-se</a>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js')
                .then(() => console.log('Service Worker registrado'))
                .catch(error => console.error('Erro ao registrar Service Worker:', error));
        }
    </script>
</body>
</html>
